<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Ruhana's birthday</title>
    <style>
        body {
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 100%);
            font-family: Arial, sans-serif;
            text-align: center;
        }
        .card {
            background: rgb(0, 0, 0);
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
        }
        h1 { color: #feffff; }
        p { color: #f7f4f4; font-size: 1.2rem; }
    </style>
</head>
<body>
    <div class="card">
        <H1>Hello birthday girl </H1>

        <h1>🎂 শুভ জন্মদিন! 🎂</h1>
        <p>দিনটি আপনার জীবনের সবচেয়ে সুন্দর মুহূর্তগুলো নিয়ে আসুক।</p>
        <p>অনেক ভালোবাসা ও শুভকামনা রইল! ❤️</p>
    </div>
</body>
</html>
